<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Flannel Games — independent games and apps.">
<title>Flannel Games</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#f5f7f8;color:#172b36;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:min(760px,100%);background:#fff;border:1px solid #dfe7ea;border-radius:20px;padding:clamp(30px,7vw,64px);box-shadow:0 12px 40px rgba(23,43,54,.08)}
.brand{font-size:.9rem;font-weight:800;letter-spacing:.12em;color:#186a71;margin-bottom:18px}
h1{font-size:clamp(2.5rem,9vw,5rem);line-height:.95;margin:0 0 22px;letter-spacing:-.04em}
p{font-size:1.1rem;line-height:1.7;margin:0 0 28px;max-width:580px}
nav{display:flex;gap:12px;flex-wrap:wrap}
a{display:inline-block;color:#fff;background:#186a71;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px}
a:hover{background:#12575d}
a:focus-visible{outline:3px solid #172b36;outline-offset:3px}
footer{margin-top:42px;font-size:.9rem;color:#65747c}
</style>
</head>
<body>
<main>
<section class="card">
<div class="brand">FLANNEL GAMES</div>
<h1>Games with a little character.</h1>
<p>Flannel Games is an independent developer creating games and apps, including Fluidity for Android.</p>
<nav><a href="/privacy/">Fluidity Privacy Policy</a></nav>
<footer>&copy; 2026 Flannel Games</footer>
</section>
</main>
</body>
</html>
